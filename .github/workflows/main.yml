name: CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      # PHP 7.4: the lowest version the module supports (phpmin, composer.json)
      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '7.4'
          tools: php-parallel-lint/php-var-dump-check, parallel-lint, cs2pr, phpcs
      - name: Run PHPCS
        run: phpcs -q --report=checkstyle --standard=codesniffer/ruleset.xml --extensions=php --ignore=*/vendor/* . | cs2pr --graceful-warnings
      - name: Run Parallel Lint
        run: parallel-lint --exclude vendor/ .
      - name: Run VarDump Check
        run: var-dump-check --extensions php --tracy --exclude vendor/ .

  # Package the module in the Dolibarr distribution format (build/module_prune-<version>.zip)
  package:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build the module package
        run: build/makepack.sh
      - name: Upload the package
        uses: actions/upload-artifact@v4
        with:
          name: module_prune
          path: build/module_prune-*.zip
          if-no-files-found: error
