name: CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:
  # Attach the package to a release when it is published
  release:
    types: [published]

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      # PHP 7.4: the lowest version the module supports (phpmin, composer.json)
      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '7.4'
          tools: php-parallel-lint/php-var-dump-check, parallel-lint, cs2pr, phpcs
      - name: Run PHPCS
        run: phpcs -q --report=checkstyle --standard=codesniffer/ruleset.xml --extensions=php --ignore=*/vendor/* . | cs2pr --graceful-warnings
      - name: Run Parallel Lint
        run: parallel-lint --exclude vendor/ .
      - name: Run VarDump Check
        run: var-dump-check --extensions php --tracy --exclude vendor/ .

  # Package the module in the Dolibarr distribution format (build/module_prune-<version>.zip)
  package:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - name: Build the module package
        run: build/makepack.sh
      - name: Upload the package
        uses: actions/upload-artifact@v4
        with:
          name: module_prune
          path: build/module_prune-*.zip
          if-no-files-found: error
      - name: Attach the package to the release
        if: github.event_name == 'release'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: gh release upload "${{ github.event.release.tag_name }}" build/module_prune-*.zip --clobber

  # Update the DoliStore product from dolistore/: dry run by hand, real submission on a published release
  dolistore:
    needs: [lint, package]
    if: github.event_name == 'release' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    permissions:
      contents: read
    concurrency:
      group: dolistore-prune
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: module_prune
          path: build
      - name: Find the package
        run: echo "ZIP=$(ls build/module_prune-*.zip)" >> "$GITHUB_ENV"
      # Pinned to a tag: the action receives the DoliStore secrets, a moving ref (@main) would let any push to its main read them
      - uses: Net-Logic/dolistore-sync@v0.4.3
        with:
          descriptor: core/modules/modPrune.class.php
          zip: ${{ env.ZIP }}
          dry-run: ${{ github.event_name == 'release' && !github.event.release.prerelease && 'false' || 'true' }}
          login: ${{ secrets.DOLISTORE_LOGIN }}
          password: ${{ secrets.DOLISTORE_PASSWORD }}

  # Regenerate the wiki page from wiki/: dry run by hand, real update on a published release
  wiki:
    needs: [lint, package]
    if: github.event_name == 'workflow_dispatch' || (github.event_name == 'release' && !github.event.release.prerelease)
    runs-on: ubuntu-latest
    permissions:
      contents: read
    concurrency:
      group: wiki-prune
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@v4
      # Pinned to a tag: the action receives the wiki secrets, a moving ref (@main) would let any push to its main read them
      - uses: Net-Logic/wiki-sync@v0.1.0
        with:
          descriptor: core/modules/modPrune.class.php
          dry-run: ${{ github.event_name == 'release' && 'false' || 'true' }}
          login: ${{ secrets.WIKI_LOGIN }}
          password: ${{ secrets.WIKI_PASSWORD }}
